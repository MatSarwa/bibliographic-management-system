<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bibliographic Management System</title>
    <!-- Applies the saved color scheme before React loads, so dark mode does not flash white.
         Light is the default; dark only after the user switches to it. -->
    <script>
      try {
        var stored = localStorage.getItem('mantine-color-scheme-value');
        document.documentElement.setAttribute('data-mantine-color-scheme', stored === 'dark' ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
